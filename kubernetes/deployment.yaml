apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-eks-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-eks-demo

  template:
    metadata:
      labels:
        app: jenkins-eks-demo

    spec:
      containers:
        - name: jenkins-eks-demo

          # Replaced by the Jenkins pipeline at deploy time (see Jenkinsfile "Deploy to EKS" stage)
          image: __IMAGE__
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jenkins-eks-demo-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: jenkins-eks-demo
