apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-eks-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-eks-demo

  template:
    metadata:
      labels:
        app: jenkins-eks-demo

    spec:
      containers:
        - name: jenkins-eks-demo

          image: 982344023689.dkr.ecr.us-east-2.amazonaws.com/test-ecr:test

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"